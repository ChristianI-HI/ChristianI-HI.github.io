<div class="pf-card">
  <div class="pf-card-body">
    <p class="pf-card-date">{{ include.page.date | date_to_string }}</p>
    <h3 class="pf-card-title">{{ include.page.title }}</h3>
    <p class="pf-card-summary">{{ include.page.content | markdownify | strip_html | truncatewords: 30 }}</p>
    <a href="{% if include.page.essayurl %}{{ include.page.essayurl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="pf-card-link">Read more &rarr;</a>
  </div>
</div>
