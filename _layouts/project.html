---
layout: default
---
{% include header.html %}
<div class="pf-page-header">
  <div class="pf-container">
    <a class="pf-back-link" href="{{ site.baseurl }}/projects/">&larr; All Projects</a>
    <h1>{{ page.title }}</h1>
    <p class="pf-date">{{ page.date }}</p>
    {% if page.labels %}
    <p class="pf-card-labels" style="margin-top: 1rem;">
      {% for label in page.labels %}
      <span class="pf-pill" style="border-color: var(--pf-border-dark); color: var(--pf-text-dark-muted);">{{ label }}</span>
      {% endfor %}
    </p>
    {% endif %}
  </div>
</div>
<div class="pf-container">
  <div class="pf-page-body">
    {{ content }}
  </div>
</div>
{% include footer.html %}
