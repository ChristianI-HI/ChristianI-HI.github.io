<footer class="pf-footer">
  <div class="pf-container pf-footer-inner">
    <span>&copy; {{ 'now' | date: "%Y" }} {{ site.data.bio.basics.name }}</span>
    <ul class="pf-footer-links">
      <li><a href="{{ '/resume.html' | prepend: site.baseurl }}">Résumé</a></li>
      <li><a href="{{ '/essays/' | prepend: site.baseurl }}">Essays</a></li>
      {% if site.data.bio.basics.email %}
      <li><a href="mailto:{{ site.data.bio.basics.email }}">Email</a></li>
      {% endif %}
      {% for profile in site.data.bio.basics.profiles %}
      <li><a href="{{ profile.url }}" target="_blank" rel="noopener">{{ profile.network | capitalize }}</a></li>
      {% endfor %}
    </ul>
  </div>
</footer>
