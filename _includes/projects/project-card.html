<div class="pf-card">
  {% if include.page.placeholder %}
  <div class="pf-card-media pf-card-media--placeholder">
    <span class="pf-placeholder-icon">Screenshot coming soon</span>
  </div>
  {% else %}
  <div class="pf-card-media">
    <img src="{{ site.baseurl }}/{{ include.page.image }}" alt="{{ include.page.title }}">
  </div>
  {% endif %}
  <div class="pf-card-body">
    <p class="pf-card-date">{{ include.page.date }}</p>
    <h3 class="pf-card-title">{{ include.page.title }}</h3>
    <p class="pf-card-summary">{{ include.page.summary }}</p>
    <p class="pf-card-labels">
      {% for label in include.page.labels %}
      <span class="pf-pill">{{ label }}</span>
      {% endfor %}
    </p>
    <a href="{% if include.page.projecturl %}{{ include.page.projecturl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="pf-card-link">Read more &rarr;</a>
  </div>
</div>
